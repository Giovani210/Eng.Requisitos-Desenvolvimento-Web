<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Professor</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/auth.js"></script>
</head>
<body>
  <div class="tela">

    <div class="painel-esquerdo">
      <img src="../imgs/professor.svg" alt="Professor com óculos segurando um livro diante de uma lousa">
    </div>

    <div class="painel-direito">
      <form class="formulario" data-login="professor" data-destino="paginaprof.html" novalidate>
        <input type="number" name="matricula" placeholder="Matrícula" aria-label="Matrícula" required>
        <input type="password" name="senha" placeholder="Senha" aria-label="Senha" required>
        <button type="submit">Entrar</button>
        <p class="dica">Demonstração: matrícula 1001 e senha prof123</p>
      </form>
    </div>

  </div>
</body>
</html>
